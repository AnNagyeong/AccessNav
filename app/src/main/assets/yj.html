<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>AccessNav Map</title>
    <style>
        html, body {
          margin: 0;
          padding: 0;
          width: 100%;
          height: 100%;
          overflow: hidden;
          background: #ffffff;
          font-family: sans-serif;
        }

        #map {
          width: 100%;
          height: 100%;
        }

        .custom-marker {
          width: 28px;
          height: 28px;
          border-radius: 50%;
          display: flex;
          align-items: center;
          justify-content: center;
          color: #ffffff;
          font-size: 13px;
          font-weight: bold;
          box-sizing: border-box;
          border: 2px solid rgba(255,255,255,0.95);
          box-shadow: 0 2px 8px rgba(0,0,0,0.18);
          user-select: none;
        }

        .marker-taxi {
          background: #f6b500;
        }

        .marker-store {
          background: #5aa7ff;
        }

        .marker-cafe {
          background: #f26a6a;
        }

        .marker-favorite {
          background: #444444;
        }

        .marker-default {
          background: #49d11a;
        }

        .current-location-marker {
          width: 18px;
          height: 18px;
          border-radius: 50%;
          background: #1f86ff;
          border: 4px solid #ffffff;
          box-shadow: 0 0 0 8px rgba(31, 134, 255, 0.18), 0 2px 8px rgba(0,0,0,0.22);
          box-sizing: border-box;
        }

        .route-point {
          min-width: 34px;
          height: 34px;
          border-radius: 18px;
          display: flex;
          align-items: center;
          justify-content: center;
          padding: 0 10px;
          color: #ffffff;
          font-size: 13px;
          font-weight: 700;
          border: 3px solid #ffffff;
          box-shadow: 0 3px 10px rgba(0,0,0,0.24);
          box-sizing: border-box;
          white-space: nowrap;
        }

        .route-point-start {
          background: #1f86ff;
        }

        .route-point-end {
          background: #48d10f;
        }

        .route-point-label {
          position: absolute;
          left: 50%;
          top: 39px;
          transform: translateX(-50%);
          max-width: 120px;
          padding: 5px 8px;
          border-radius: 12px;
          background: rgba(255,255,255,0.96);
          color: #222222;
          font-size: 11px;
          font-weight: 600;
          box-shadow: 0 2px 8px rgba(0,0,0,0.16);
          overflow: hidden;
          text-overflow: ellipsis;
          white-space: nowrap;
        }

    </style>
</head>
<body>
<div id="map"></div>

<script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=80e48dd01aae3f043d16e5ad41071f5d&libraries=services"></script>
<script>
    let map;
    let markers = [];
    let placesService;
    let currentLocationOverlay = null;
    let startPlaceOverlay = null;
    let endPlaceOverlay = null;
    let currentCategory = "all";

    const DEFAULT_CENTER = {
      lat: 37.56184,
      lng: 127.03811
    };

    const DEFAULT_LEVEL = 3;
    const LOCAL_SEARCH_PLACES = [
      {
        place_name: "한양여자대학교",
        road_address_name: "서울 성동구 살곶이길 200",
        address_name: "서울 성동구 사근동 110",
        y: 37.55917,
        x: 127.04924
      },
      {
        place_name: "한양대학교 서울캠퍼스",
        road_address_name: "서울 성동구 왕십리로 222",
        address_name: "서울 성동구 사근동 110",
        y: 37.55723,
        x: 127.04538
      },
      {
        place_name: "한양대학교병원",
        road_address_name: "서울 성동구 왕십리로 222-1",
        address_name: "서울 성동구 사근동 110",
        y: 37.55966,
        x: 127.04435
      }
    ];

    function initMap() {
      const container = document.getElementById("map");
      const options = {
        center: new kakao.maps.LatLng(DEFAULT_CENTER.lat, DEFAULT_CENTER.lng),
        level: DEFAULT_LEVEL
      };

      map = new kakao.maps.Map(container, options);
      placesService = new kakao.maps.services.Places();
      map.setZoomable(true);
    }

    function clearMarkers() {
      markers.forEach(marker => marker.setMap(null));
      markers = [];
    }

    function normalizeCategory(item) {
      const raw = String(
        item.category ?? item.type ?? item.kind ?? item.group ?? ""
      ).toLowerCase();

      if (raw.includes("taxi") || raw.includes("택시") || raw.includes("정류장")) {
        return "taxi";
      }

      if (raw.includes("store") || raw.includes("편의점") || raw.includes("storefront")) {
        return "store";
      }

      if (raw.includes("cafe") || raw.includes("카페") || raw.includes("coffee")) {
        return "cafe";
      }

      if (raw.includes("favorite") || raw.includes("즐겨찾기") || raw.includes("star")) {
        return "favorite";
      }

      return "default";
    }

    function parseLatLng(item) {
      const lat = item.lat ?? item.latitude ?? item.y ?? item.mapy ?? null;
      const lng = item.lng ?? item.lon ?? item.longitude ?? item.x ?? item.mapx ?? null;

      if (lat == null || lng == null) return null;

      const latNum = Number(lat);
      const lngNum = Number(lng);

      if (Number.isNaN(latNum) || Number.isNaN(lngNum)) return null;

      return { lat: latNum, lng: lngNum };
    }

    function getMarkerSymbol(category) {
      switch (category) {
        case "taxi":
          return "★";
        case "store":
          return "●";
        case "cafe":
          return "●";
        case "favorite":
          return "★";
        default:
          return "•";
      }
    }

    function getMarkerClass(category) {
      switch (category) {
        case "taxi":
          return "marker-taxi";
        case "store":
          return "marker-store";
        case "cafe":
          return "marker-cafe";
        case "favorite":
          return "marker-favorite";
        default:
          return "marker-default";
      }
    }

    function createMarker(item) {
      const pos = parseLatLng(item);
      if (!pos) return null;

      const category = normalizeCategory(item);

      if (currentCategory !== "all" && currentCategory !== category) {
        return null;
      }

      const markerEl = document.createElement("div");
      markerEl.className = `custom-marker ${getMarkerClass(category)}`;
      markerEl.textContent = getMarkerSymbol(category);

      const overlay = new kakao.maps.CustomOverlay({
        position: new kakao.maps.LatLng(pos.lat, pos.lng),
        content: markerEl,
        yAnchor: 1
      });

      overlay.setMap(map);

      markerEl.addEventListener("click", () => {
        const title = item.name || item.title || item.place_name || "장소";
        console.log("clicked:", title);
      });

      return overlay;
    }

    function renderMarkers(data) {
      clearMarkers();

      if (!Array.isArray(data)) {
        console.warn("poi.json must be an array.");
        return;
      }

      data.forEach(item => {
        const marker = createMarker(item);
        if (marker) {
          markers.push(marker);
        }
      });
    }

    async function loadPoiData() {
      try {
        const response = await fetch("./poi.json");
        if (!response.ok) {
          throw new Error("poi.json load failed: " + response.status);
        }

        const data = await response.json();
        renderMarkers(data);
      } catch (e) {
        console.error("poi.json load error:", e);
      }
    }

    function filterMarkers(category) {
      currentCategory = category || "all";
      loadPoiData();
    }

    function searchPlaces(keyword) {
      const query = String(keyword || "").trim();
      if (!query) return;
      if (!placesService) {
        setTimeout(() => searchPlaces(query), 200);
        return;
      }

      placesService.keywordSearch(query, (data, status) => {
        if (status !== kakao.maps.services.Status.OK || !Array.isArray(data)) {
          console.warn("search failed:", query, status);
          const fallback = getLocalSearchPlaces(query);
          if (fallback.length > 0) {
            renderSearchPlaces(fallback);
            return;
          }

          if (window.AndroidBridge && window.AndroidBridge.onSearchResults) {
            window.AndroidBridge.onSearchResults("[]");
          }
          return;
        }

        renderSearchPlaces(data);
      }, { size: 15 });
    }

    function getLocalSearchPlaces(query) {
      const normalizedQuery = String(query || "").replace(/\s/g, "").toLowerCase();

      if (!normalizedQuery) {
        return [];
      }

      return LOCAL_SEARCH_PLACES.filter(place => {
        const name = String(place.place_name || "").replace(/\s/g, "").toLowerCase();
        const road = String(place.road_address_name || "").replace(/\s/g, "").toLowerCase();
        const address = String(place.address_name || "").replace(/\s/g, "").toLowerCase();

        return name.includes(normalizedQuery) ||
          normalizedQuery.includes(name) ||
          road.includes(normalizedQuery) ||
          address.includes(normalizedQuery);
      });
    }

    function renderSearchPlaces(data) {
      const results = [];

      data.forEach(place => {
        const lat = Number(place.y);
        const lng = Number(place.x);

        if (Number.isNaN(lat) || Number.isNaN(lng)) {
          return;
        }

        results.push({
          name: place.place_name || "",
          address: place.road_address_name || place.address_name || "",
          lat,
          lng
        });
      });

      if (window.AndroidBridge && window.AndroidBridge.onSearchResults) {
        window.AndroidBridge.onSearchResults(JSON.stringify(results));
      }
    }

    function zoomIn() {
      if (!map) return;
      map.setLevel(map.getLevel() - 1);
    }

    function zoomOut() {
      if (!map) return;
      map.setLevel(map.getLevel() + 1);
    }

    function moveTo(lat, lng, level) {
      if (!map) return;
      const latNum = Number(lat);
      const lngNum = Number(lng);

      if (Number.isNaN(latNum) || Number.isNaN(lngNum)) {
        return;
      }

      const position = new kakao.maps.LatLng(latNum, lngNum);

      if (level !== undefined && level !== null) {
        const nextLevel = Number(level);
        if (!Number.isNaN(nextLevel) && map.getLevel() !== nextLevel) {
          try {
            map.setLevel(nextLevel, { animate: true });
          } catch (error) {
            map.setLevel(nextLevel);
          }
        }
      }

      map.panTo(position);
    }

    function setRoutePoint(type, lat, lng, name) {
      if (!map) {
        setTimeout(() => setRoutePoint(type, lat, lng, name), 200);
        return;
      }

      const latNum = Number(lat);
      const lngNum = Number(lng);

      if (Number.isNaN(latNum) || Number.isNaN(lngNum)) {
        return;
      }

      const position = new kakao.maps.LatLng(latNum, lngNum);
      const isStart = type === "start";
      const previousOverlay = isStart ? startPlaceOverlay : endPlaceOverlay;

      if (previousOverlay) {
        previousOverlay.setMap(null);
      }

      const wrap = document.createElement("div");
      wrap.style.position = "relative";
      wrap.style.display = "inline-flex";
      wrap.style.justifyContent = "center";

      const badge = document.createElement("div");
      badge.className = `route-point ${isStart ? "route-point-start" : "route-point-end"}`;
      badge.textContent = isStart ? "출발" : "도착";
      wrap.appendChild(badge);

      const label = document.createElement("div");
      label.className = "route-point-label";
      label.textContent = String(name || (isStart ? "출발지" : "목적지"));
      wrap.appendChild(label);

      const overlay = new kakao.maps.CustomOverlay({
        position,
        content: wrap,
        xAnchor: 0.5,
        yAnchor: 1.4,
        zIndex: isStart ? 30 : 31
      });

      overlay.setMap(map);

      if (isStart) {
        startPlaceOverlay = overlay;
      } else {
        endPlaceOverlay = overlay;
      }
    }

    function showCurrentLocation(lat, lng) {
      if (!map) {
        setTimeout(() => showCurrentLocation(lat, lng), 200);
        return;
      }

      const latNum = Number(lat);
      const lngNum = Number(lng);

      if (Number.isNaN(latNum) || Number.isNaN(lngNum)) {
        return;
      }

      const position = new kakao.maps.LatLng(latNum, lngNum);

      if (currentLocationOverlay) {
        currentLocationOverlay.setMap(null);
      }

      const markerEl = document.createElement("div");
      markerEl.className = "current-location-marker";

      currentLocationOverlay = new kakao.maps.CustomOverlay({
        position,
        content: markerEl,
        xAnchor: 0.5,
        yAnchor: 0.5,
        zIndex: 10
      });

      currentLocationOverlay.setMap(map);
      map.setCenter(position);
      map.setLevel(3);
    }

    function resetMap() {
      if (!map) return;
      map.setCenter(new kakao.maps.LatLng(DEFAULT_CENTER.lat, DEFAULT_CENTER.lng));
      map.setLevel(DEFAULT_LEVEL);
    }

    window.zoomIn = zoomIn;
    window.zoomOut = zoomOut;
    window.moveTo = moveTo;
    window.resetMap = resetMap;
    window.filterMarkers = filterMarkers;
    window.searchPlaces = searchPlaces;
    window.setRoutePoint = setRoutePoint;
    window.showCurrentLocation = showCurrentLocation;
    window.map = map;

    window.onload = function () {
  initMap();
  window.map = map;
};
</script>
</body>
</html>
